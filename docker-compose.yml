services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aig}
      POSTGRES_USER: ${POSTGRES_USER:-aig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before deployment}
    volumes:
      - aig-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ai-infra-guard-network]
    restart: unless-stopped

  migrate:
    image: aig-platform:local
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    command: ["migrate"]
    environment:
      DB_DRIVER: postgres
      DB_DSN: ${DB_DSN:?set a URL-encoded DB_DSN before deployment}
      MODEL_MASTER_KEY_ID: ${MODEL_MASTER_KEY_ID:-}
      MODEL_MASTER_KEY: ${MODEL_MASTER_KEY:-}
      MODEL_PREVIOUS_MASTER_KEYS: ${MODEL_PREVIOUS_MASTER_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-infra-guard-network]
    restart: "no"

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-infra-guard-webserver
    ports: ["8088:8088"]
    environment:
      APP_ENV: production
      UPLOAD_DIR: /app/uploads
      DB_DRIVER: postgres
      DB_DSN: ${DB_DSN:?set a URL-encoded DB_DSN before deployment}
      MODEL_MASTER_KEY_ID: ${MODEL_MASTER_KEY_ID:-}
      MODEL_MASTER_KEY: ${MODEL_MASTER_KEY:-}
      MODEL_PREVIOUS_MASTER_KEYS: ${MODEL_PREVIOUS_MASTER_KEYS:-}
      AIG_AGENT_TOKEN: ${AIG_AGENT_TOKEN:-}
      AIG_MAX_UPLOAD_BYTES: ${AIG_MAX_UPLOAD_BYTES:-52428800}
      AIG_MAX_CHUNK_BYTES: ${AIG_MAX_CHUNK_BYTES:-5242880}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks: [ai-infra-guard-network]
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8088/"]
      interval: 30s
      timeout: 3s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile_Agent
    container_name: ai-infra-guard-agent
    environment:
      TZ: Asia/Shanghai
      AIG_SERVER: webserver:8088
      AIG_AGENT_TOKEN: ${AIG_AGENT_TOKEN:-}
    cap_add: [SYS_ADMIN]
    security_opt: [seccomp:unconfined]
    shm_size: 2gb
    networks: [ai-infra-guard-network]
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      webserver:
        condition: service_healthy

volumes:
  aig-postgres-data:

networks:
  ai-infra-guard-network:
    driver: bridge
    name: ai-infra-guard-network
