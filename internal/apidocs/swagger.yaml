basePath: /
definitions:
  admin.AuditListResponse:
    description: Paginated sanitized audit-event envelope.
    properties:
      items:
        items:
          $ref: '#/definitions/audit.Event'
        type: array
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      total:
        format: int64
        minimum: 0
        type: integer
    required:
    - items
    - total
    - page
    - page_size
    type: object
  admin.UserListResponse:
    description: Administrator-only paginated local-account envelope.
    properties:
      items:
        items:
          $ref: '#/definitions/admin.UserResponse'
        type: array
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      total:
        format: int64
        minimum: 0
        type: integer
    required:
    - items
    - total
    - page
    - page_size
    type: object
  admin.UserResponse:
    description: Safe local-account metadata; credentials and credential hashes are not representable.
    properties:
      active:
        type: boolean
      created_at:
        format: date-time
        type: string
      id:
        type: string
      must_change_password:
        type: boolean
      role:
        enum:
        - admin
        - user
        - auditor
        type: string
      updated_at:
        format: date-time
        type: string
      username:
        type: string
    required:
    - id
    - username
    - role
    - active
    - must_change_password
    - created_at
    - updated_at
    type: object
  audit.Event:
    description: Append-only event with recursively sanitized metadata. Secret-like metadata keys are replaced by a redaction marker before persistence and response.
    properties:
      action:
        description: Governance action, including attachment.download_authorized for an approved administrator cross-owner download.
        type: string
      actor_role:
        enum:
        - admin
        - user
        - auditor
        type: string
      actor_user_id:
        type: string
      actor_username:
        type: string
      client_ip:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: true
        description: Sanitized JSON metadata only.
        type: object
      occurred_at:
        format: date-time
        type: string
      outcome:
        enum:
        - pending
        - success
        - failure
        type: string
      request_id:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
    required:
    - id
    - occurred_at
    - action
    - outcome
    - metadata
    type: object
  brand.Config:
    description: Current mutable brand configuration. Logo bytes are returned only by the brand API and are never copied into report list or detail payloads.
    properties:
      logo:
        description: Base64-encoded PNG or JPEG bytes. An empty string means that no logo is configured.
        format: byte
        type: string
      logo_mime:
        description: Empty when logo is empty; otherwise image/png or image/jpeg.
        enum:
        - ""
        - image/png
        - image/jpeg
        type: string
      primary_color:
        description: Six-digit hexadecimal primary color.
        example: '#1677FF'
        pattern: ^#[0-9A-Fa-f]{6}$
        type: string
      product_name:
        maxLength: 128
        type: string
      updated_at:
        format: date-time
        readOnly: true
        type: string
      updated_by:
        description: Authenticated administrator user ID that last changed the configuration.
        readOnly: true
        type: string
      watermark:
        maxLength: 64
        type: string
    required:
    - product_name
    - primary_color
    - logo
    - logo_mime
    - watermark
    type: object
  brand.PublicConfig:
    description: Exact anonymous login-page-safe brand projection.
    properties:
      logo_data_url:
        description: A validated data:image/png;base64 or data:image/jpeg;base64 value; empty string when no valid Logo is configured.
        pattern: '^(?:|data:image/(?:png|jpeg);base64,[A-Za-z0-9+/]+={0,2})$'
        type: string
      primary_color:
        example: '#1677FF'
        pattern: ^#[0-9A-Fa-f]{6}$
        type: string
      product_name:
        maxLength: 128
        type: string
    required:
    - product_name
    - primary_color
    - logo_data_url
    type: object
  brand.UpdateRequest:
    properties:
      logo:
        description: Optional base64-encoded PNG or JPEG no larger than 1 MiB after decoding, at most 4096 pixels on either axis and 16,777,216 pixels total. Empty clears the logo.
        format: byte
        type: string
      logo_mime:
        description: Must match the decoded image; empty when logo is empty.
        enum:
        - ""
        - image/png
        - image/jpeg
        type: string
      primary_color:
        example: '#1677FF'
        pattern: ^#[0-9A-Fa-f]{6}$
        type: string
      product_name:
        maxLength: 128
        type: string
      watermark:
        maxLength: 64
        type: string
    required:
    - product_name
    - primary_color
    - logo
    - logo_mime
    - watermark
    type: object
  dashboard.AttentionItem:
    description: Narrow report snapshot requiring attention; no engine, owner, attachment, or render source data is included.
    properties:
      completed_at:
        format: date-time
        type: string
      high:
        minimum: 0
        type: integer
      low:
        minimum: 0
        type: integer
      medium:
        minimum: 0
        type: integer
      report_id:
        type: string
      score:
        maximum: 100
        minimum: 0
        type: integer
      task_id:
        type: string
      task_type:
        enum:
        - mcp_scan
        - ai_infra_scan
        - model_redteam_report
        - agent_scan
        type: string
    required:
    - report_id
    - task_id
    - task_type
    - completed_at
    - score
    - high
    - medium
    - low
    type: object
  dashboard.TrendPoint:
    properties:
      completed:
        minimum: 0
        type: integer
      date:
        description: UTC calendar day at 00:00:00Z.
        format: date-time
        type: string
      high:
        minimum: 0
        type: integer
      low:
        minimum: 0
        type: integer
      medium:
        minimum: 0
        type: integer
      security_score:
        maximum: 100
        minimum: 0
        type: integer
        x-nullable: true
    required:
    - date
    - completed
    - security_score
    - high
    - medium
    - low
    type: object
  dashboard.View:
    description: Subject-scoped governed dashboard. The trend is always exactly 30 ascending UTC day buckets.
    properties:
      attention:
        items:
          $ref: '#/definitions/dashboard.AttentionItem'
        maxItems: 5
        type: array
      has_data:
        type: boolean
      mapping_versions:
        items:
          type: string
        type: array
      recent_tasks:
        items:
          $ref: '#/definitions/tasks.TaskSummary'
        maxItems: 5
        type: array
      risk:
        $ref: '#/definitions/reports.RiskSummary'
      security_score:
        maximum: 100
        minimum: 0
        type: integer
        x-nullable: true
      trend:
        description: Exactly 30 zero-filled, ascending UTC calendar-day buckets ending today.
        items:
          $ref: '#/definitions/dashboard.TrendPoint'
        maxItems: 30
        minItems: 30
        type: array
    required:
    - has_data
    - security_score
    - mapping_versions
    - risk
    - trend
    - recent_tasks
    - attention
    type: object
  identity.CSRFResponse:
    properties:
      csrf_token:
        description: Double-submit token matching the aig_csrf cookie; use it only in X-CSRF-Token.
        type: string
    required:
    - csrf_token
    type: object
  identity.CurrentSubjectResponse:
    description: Current Cookie-session Subject, intentionally available before the password-change completion gate.
    properties:
      id:
        type: string
      must_change_password:
        type: boolean
      role:
        enum:
        - admin
        - user
        - auditor
        type: string
      username:
        type: string
    required:
    - id
    - username
    - role
    - must_change_password
    type: object
  identity.LoginRequest:
    properties:
      password:
        format: password
        type: string
        x-write-only: true
      username:
        type: string
    required:
    - username
    - password
    type: object
  identity.LoginResponse:
    properties:
      must_change_password:
        type: boolean
    required:
    - must_change_password
    type: object
  identity.PasswordResetConfirmRequest:
    properties:
      temporary_password:
        format: password
        type: string
        x-write-only: true
      token:
        format: password
        type: string
        x-write-only: true
    required:
    - token
    - temporary_password
    type: object
  models.CatalogPage:
    description: Paginated governed model catalog containing encrypted platform rows followed by immutable YAML rows.
    properties:
      items:
        items:
          $ref: '#/definitions/models.CatalogView'
        type: array
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      total:
        format: int64
        minimum: 0
        type: integer
    required:
    - items
    - total
    - page
    - page_size
    type: object
  models.CatalogView:
    properties:
      base_url:
        type: string
      created_at:
        format: date-time
        type: string
      disabled:
        type: boolean
      id:
        type: string
      limit:
        type: integer
      name:
        type: string
      note:
        type: string
      owner_user_id:
        description: Present only for an authorized encrypted private model; empty for YAML rows.
        type: string
      provider_model:
        type: string
      read_only:
        description: True for YAML rows and for encrypted rows the current Subject cannot mutate.
        type: boolean
      scope:
        enum:
        - private
        - global
        type: string
      source:
        enum:
        - platform
        - yaml
        type: string
      token:
        description: Always masked as ********; plaintext and encrypted storage material are never returned.
        example: '********'
        type: string
      updated_at:
        format: date-time
        type: string
    required:
    - id
    - scope
    - name
    - provider_model
    - base_url
    - disabled
    - token
    - source
    - read_only
    type: object
  models.CreateInput:
    properties:
      base_url:
        type: string
      limit:
        type: integer
      name:
        type: string
      note:
        type: string
      provider_model:
        type: string
      scope:
        enum:
        - private
        - global
        type: string
      token:
        description: Write-only plaintext token encrypted before persistence and never returned.
        format: password
        type: string
        x-write-only: true
    required:
    - name
    - provider_model
    - base_url
    - token
    - scope
    type: object
  models.UpdateInput:
    properties:
      base_url:
        type: string
      disabled:
        type: boolean
      limit:
        type: integer
      name:
        type: string
      note:
        type: string
      provider_model:
        type: string
      token:
        description: Optional write-only replacement. Omit, empty, or ******** preserves the stored encrypted token.
        format: password
        type: string
        x-write-only: true
    type: object
  models.View:
    properties:
      base_url:
        type: string
      created_at:
        format: date-time
        type: string
      disabled:
        type: boolean
      id:
        type: string
      limit:
        type: integer
      name:
        type: string
      note:
        type: string
      owner_user_id:
        type: string
      provider_model:
        type: string
      scope:
        enum:
        - private
        - global
        type: string
      token:
        description: Always masked as ********; plaintext and encrypted storage material are never returned.
        example: '********'
        type: string
      updated_at:
        format: date-time
        type: string
    required:
    - id
    - scope
    - name
    - provider_model
    - base_url
    - disabled
    - token
    - created_at
    - updated_at
    type: object
  reports.BackfillRequest:
    properties:
      task_id:
        description: Trusted completed platform task whose missing immutable report snapshot should be generated.
        maxLength: 128
        minLength: 1
        type: string
    required:
    - task_id
    type: object
  reports.ReportDetail:
    description: Safe immutable online report. It contains only the frozen RenderModel and public report metadata; stored source results, render payloads, private ownership metadata, Logo bytes, paths, and mutable brand records are absent.
    properties:
      completed_at:
        format: date-time
        type: string
      created_at:
        description: Immutable report generation time.
        format: date-time
        type: string
      id:
        type: string
      render:
        $ref: '#/definitions/reports.RenderModel'
      risk:
        $ref: '#/definitions/reports.RiskSummary'
      task_id:
        type: string
      task_type:
        type: string
    required:
    - id
    - task_id
    - task_type
    - completed_at
    - created_at
    - risk
    - render
    type: object
  reports.ReportSummary:
    description: Bounded safe report-list item. Stored raw results, render JSON, owner IDs, Logo bytes, and mutable brand metadata are omitted.
    properties:
      brand_product_name:
        type: string
      completed_at:
        format: date-time
        type: string
      created_at:
        format: date-time
        type: string
      id:
        type: string
      risk:
        $ref: '#/definitions/reports.RiskSummary'
      task_id:
        type: string
      task_type:
        type: string
    required:
    - id
    - task_id
    - task_type
    - completed_at
    - created_at
    - risk
    - brand_product_name
    type: object
  reports.ReportListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/reports.ReportSummary'
        type: array
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      total:
        format: int64
        minimum: 0
        type: integer
    required:
    - items
    - total
    - page
    - page_size
    type: object
  reports.RenderModel:
    description: Versioned presentation model frozen when the snapshot is created. Online detail and every PDF retry consume this same immutable value.
    properties:
      completed_at:
        format: date-time
        type: string
      conclusion:
        type: string
      coverage:
        type: string
      generated_at:
        format: date-time
        type: string
      mapping_version:
        type: string
      port_scan_mode:
        description: Optional trusted AI infrastructure TCP port scan mode. Present only with its matching port_spec.
        enum:
        - fixed_ai
        - full_tcp
        type: string
      port_spec:
        description: Optional trusted TCP port expression paired with port_scan_mode; only the documented mode/spec combinations are valid.
        enum:
        - 11434,1337,7000-9000,18789
        - 1-65535
        type: string
      primary_color:
        type: string
      product_name:
        type: string
      recommendations:
        items:
          type: string
        type: array
      render_version:
        example: report-render-v2
        type: string
      risk:
        $ref: '#/definitions/reports.RiskSummary'
      risk_distribution:
        $ref: '#/definitions/reports.RiskDistribution'
      risk_trend:
        description: Exactly 30 immutable, zero-filled UTC calendar-day buckets ending on generated_at's UTC date.
        items:
          $ref: '#/definitions/reports.TrendPoint'
        maxItems: 30
        minItems: 30
        type: array
      score_explanation:
        type: string
      task_id:
        type: string
      task_type:
        type: string
      technical_findings:
        items:
          $ref: '#/definitions/reports.TechnicalFinding'
        type: array
      top_risks:
        items:
          $ref: '#/definitions/reports.TopRisk'
        type: array
      watermark:
        description: Frozen watermark text used by online and PDF rendering.
        type: string
    required:
    - render_version
    - mapping_version
    - generated_at
    - completed_at
    - task_id
    - task_type
    - product_name
    - primary_color
    - watermark
    - risk
    - score_explanation
    - risk_trend
    - risk_distribution
    - top_risks
    - technical_findings
    - recommendations
    - coverage
    - conclusion
    type: object
  reports.RiskDistribution:
    properties:
      high:
        minimum: 0
        type: integer
      low:
        minimum: 0
        type: integer
      medium:
        minimum: 0
        type: integer
    required:
    - high
    - medium
    - low
    type: object
  reports.RiskSummary:
    properties:
      high:
        minimum: 0
        type: integer
      low:
        minimum: 0
        type: integer
      mapping_version:
        example: risk-v2
        type: string
      medium:
        minimum: 0
        type: integer
      score:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - mapping_version
    - high
    - medium
    - low
    - score
    type: object
  reports.TechnicalFinding:
    properties:
      evidence:
        type: string
      impact:
        type: string
      remediation:
        type: string
      title:
        type: string
    required:
    - title
    - evidence
    - impact
    - remediation
    type: object
  reports.TopRisk:
    properties:
      count:
        minimum: 0
        type: integer
      impact:
        type: string
      remediation:
        type: string
      severity:
        enum:
        - high
        - medium
        - low
        type: string
    required:
    - severity
    - count
    - impact
    - remediation
    type: object
  reports.TrendPoint:
    properties:
      completed:
        minimum: 0
        type: integer
      date:
        description: UTC day bucket represented at 00:00:00Z.
        format: date-time
        type: string
      high:
        minimum: 0
        type: integer
      low:
        minimum: 0
        type: integer
      medium:
        minimum: 0
        type: integer
    required:
    - date
    - completed
    - high
    - medium
    - low
    type: object
  tasks.AttachmentView:
    description: Opaque attachment metadata; storage location and owner identifiers are not returned.
    properties:
      created_at:
        format: date-time
        type: string
      filename:
        type: string
      id:
        type: string
      size:
        format: int64
        minimum: 0
        type: integer
      state:
        enum:
        - uploading
        - ready
        type: string
    required:
    - id
    - filename
    - size
    - state
    - created_at
    type: object
  tasks.TaskDetail:
    description: Browser-safe task detail with only display-safe input metadata.
    properties:
      created_at:
        format: date-time
        type: string
      id:
        type: string
      input_summary:
        $ref: '#/definitions/tasks.TaskInputSummary'
      owner:
        type: string
      status:
        enum:
        - pending
        - dispatching
        - running
        - succeeded
        - failed
        - dispatch_failed
        - dispatch_unknown
        - cancelled
        type: string
      task_type:
        enum:
        - mcp_scan
        - ai_infra_scan
        - model_redteam_report
        - agent_scan
        - unknown
        type: string
      updated_at:
        format: date-time
        type: string
    required:
    - id
    - owner
    - task_type
    - status
    - created_at
    - updated_at
    - input_summary
    type: object
  tasks.TaskCreateBadRequestResponse:
    description: Fixed generalized bad-request body; it never echoes attachment identifiers, paths, states, request content, or internal errors.
    properties:
      error:
        enum:
        - invalid task request
        - attachment unavailable
        type: string
    required:
    - error
    type: object
  tasks.TaskCreateErrorResponse:
    description: Fixed dispatch-unavailable error with the same browser-safe task detail returned by a successful create.
    properties:
      error:
        enum:
        - task dispatch unavailable
        type: string
      task:
        $ref: '#/definitions/tasks.TaskDetail'
    required:
    - error
    - task
    type: object
  tasks.TaskInputSummary:
    description: Task-type-specific display metadata; source content, arbitrary parameters, credentials, URLs, attachment references, and engine data are absent.
    properties:
      language:
        enum:
        - zh
        - en
        type: string
      model_id:
        description: Opaque persisted and validated AI infrastructure model reference for current catalog-label recovery; not a Token, Base URL, credential, or current-availability claim.
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        type: string
      num_prompts:
        maximum: 1000000
        minimum: 1
        type: integer
      port_scan_mode:
        description: Canonical AI infrastructure TCP port discovery mode; raw task parameters are not exposed.
        enum:
        - fixed_ai
        - full_tcp
        type: string
      target_count:
        minimum: 1
        type: integer
      thread:
        maximum: 1024
        minimum: 1
        type: integer
      timeout:
        maximum: 86400
        minimum: 1
        type: integer
    type: object
  tasks.TaskListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/tasks.TaskSummary'
        type: array
      page:
        minimum: 1
        type: integer
      page_size:
        maximum: 100
        minimum: 1
        type: integer
      total:
        format: int64
        minimum: 0
        type: integer
    required:
    - items
    - total
    - page
    - page_size
    type: object
  tasks.TaskSummary:
    description: Narrow browser list item.
    properties:
      created_at:
        format: date-time
        type: string
      id:
        type: string
      owner:
        type: string
      status:
        enum:
        - pending
        - dispatching
        - running
        - succeeded
        - failed
        - dispatch_failed
        - dispatch_unknown
        - cancelled
        type: string
      task_type:
        enum:
        - mcp_scan
        - ai_infra_scan
        - model_redteam_report
        - agent_scan
        - unknown
        type: string
      updated_at:
        format: date-time
        type: string
    required:
    - id
    - owner
    - task_type
    - status
    - created_at
    - updated_at
    type: object
  websocket.LegacyModelCreateRequest:
    description: Deprecated browser request shape retained for compatibility. The model object is required and its token is accepted only as write-only secret input.
    properties:
      model:
        $ref: '#/definitions/websocket.LegacyModelInfo'
      model_id:
        description: Compatibility model ID. Path separators and identifiers longer than 128 characters are rejected.
        maxLength: 128
        type: string
    required:
    - model_id
    - model
    type: object
  websocket.LegacyModelDeleteRequest:
    properties:
      model_ids:
        description: Compatibility model IDs to delete as one legacy collection request.
        items:
          maxLength: 128
          type: string
        minItems: 1
        type: array
    required:
    - model_ids
    type: object
  websocket.LegacyModelDetailEnvelope:
    properties:
      data:
        $ref: '#/definitions/websocket.LegacyModelView'
      message:
        type: string
      status:
        description: Legacy application status. Zero means success; validation and not-found errors use one while retaining HTTP 200.
        type: integer
    type: object
  websocket.LegacyModelInfo:
    properties:
      base_url:
        type: string
      limit:
        type: integer
      model:
        type: string
      note:
        type: string
      token:
        description: Write-only plaintext token. It is authenticated-encrypted before storage and is never returned.
        format: password
        type: string
    required:
    - model
    - token
    - base_url
    type: object
  websocket.LegacyModelListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/websocket.LegacyModelView'
        type: array
      message:
        type: string
      status:
        description: Legacy application status. Zero means success.
        type: integer
    type: object
  websocket.LegacyModelMutationEnvelope:
    properties:
      data:
        description: Null for legacy create, update, and collection-delete responses.
        type: object
        x-nullable: true
      message:
        type: string
      status:
        description: Legacy application status. Zero means success; validation and not-found errors use one while retaining HTTP 200.
        type: integer
    type: object
  websocket.LegacyModelUpdateInfo:
    properties:
      base_url:
        type: string
      limit:
        type: integer
      model:
        type: string
      note:
        type: string
      token:
        description: Optional write-only replacement token. Omit it or send the mask sentinel to preserve the stored token.
        format: password
        type: string
    type: object
  websocket.LegacyModelUpdateRequest:
    properties:
      model:
        $ref: '#/definitions/websocket.LegacyModelUpdateInfo'
    required:
    - model
    type: object
  websocket.LegacyModelView:
    properties:
      default:
        description: Task-type identifiers copied from a read-only YAML model. Encrypted platform models return an explicit empty array.
        items:
          type: string
        type: array
      model:
        $ref: '#/definitions/websocket.LegacyModelViewInfo'
      model_id:
        type: string
    type: object
  websocket.LegacyModelViewInfo:
    properties:
      base_url:
        type: string
      limit:
        type: integer
      model:
        type: string
      note:
        type: string
      token:
        description: Always masked as ********; plaintext, ciphertext, nonce, and key identifiers are never exposed.
        example: '********'
        type: string
    type: object
  websocket.SafeVersionResponse:
    description: Anonymous build metadata allowlist.
    properties:
      build_time:
        type: string
      commit:
        type: string
      version:
        type: string
    required:
    - version
    - commit
    - build_time
    type: object
info:
  contact: {}
  description: API for managing AIG Custom Platform AI security scanning tasks. Based on Tencent Zhuque Lab AI-Infra-Guard (https://github.com/Tencent/AI-Infra-Guard).
  title: AIG Custom Platform 任务API
  version: "1.0"
paths:
  /api/v1/auth/csrf:
    get:
      description: This anonymous double-submit CSRF initialization creates no session and sets an aig_csrf cookie at Path=/ with Secure in production, HttpOnly=false, and SameSite=Lax, then returns the same value as csrf_token. Send that value as X-CSRF-Token on unsafe methods.
      produces:
      - application/json
      responses:
        "200":
          description: Anonymous CSRF token and matching cookie.
          headers:
            Set-Cookie:
              description: aig_csrf double-submit cookie.
              type: string
          schema:
            $ref: '#/definitions/identity.CSRFResponse'
        "426":
          description: HTTPS is required by the production Cookie policy.
        "500":
          description: Secure token generation failed; no internal detail is returned.
      summary: Initialize anonymous browser CSRF state
      tags:
      - identity
  /api/v1/auth/me:
    get:
      description: Restores the current server-derived Cookie-session Subject. This safe method is deliberately reachable before the password-change completion gate so the browser can read must_change_password. Browser identity headers are ignored.
      produces:
      - application/json
      responses:
        "200":
          description: Current authenticated Subject.
          schema:
            $ref: '#/definitions/identity.CurrentSubjectResponse'
        "401":
          description: Missing, expired, revoked, or invalid session Cookie.
        "426":
          description: HTTPS is required by the production Cookie policy.
      summary: Get the current browser Subject
      tags:
      - identity
  /api/v1/platform/dashboard:
    get:
      description: Returns one Subject-scoped dashboard snapshot. Users aggregate only their own reports and tasks; auditors and administrators receive the global scope. The trend contains exactly 30 UTC calendar-day buckets including today, and recent tasks/attention are capped at five. Empty state is has_data=false, security_score=null, zero risk counts, 30 zero-filled buckets, and empty attention; it is never represented as score 100.
      produces:
      - application/json
      responses:
        "200":
          description: Governed dashboard snapshot.
          schema:
            $ref: '#/definitions/dashboard.View'
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or the Subject role is unsupported.
        "500":
          description: Dashboard aggregation failed; internal details are not exposed.
      summary: Get governed enterprise dashboard
      tags:
      - platform-dashboard
  /api/v1/public/brand:
    get:
      description: Anonymous exact safe brand projection. It returns only product_name, primary_color, and logo_data_url. The Logo value is empty or a verified PNG/JPEG data URL; mutable governance and storage fields are absent.
      produces:
      - application/json
      responses:
        "200":
          description: Login-page-safe public brand.
          schema:
            $ref: '#/definitions/brand.PublicConfig'
        "500":
          description: Brand storage unavailable; internal details are not exposed.
      summary: Get anonymous safe brand
      tags:
      - public
  /api/v1/version:
    get:
      description: Returns only the running version and build-injected commit/build_time allowlist. Missing build values are the literal unknown. No files or remote services are consulted by this endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: Anonymous safe build metadata.
          schema:
            $ref: '#/definitions/websocket.SafeVersionResponse'
      summary: Get anonymous safe build metadata
      tags:
      - public
  /api/v1/platform/admin/reports/backfill:
    post:
      consumes:
      - application/json
      description: An administrator-only repair for a trusted completed task with a missing snapshot. Requires Cookie authentication, the password-change gate, and CSRF. The operation never accepts browser-supplied raw engine results, is idempotent for an existing snapshot, and records durable pending/completion audit state through the outbox.
      parameters:
      - in: body
        name: backfill
        required: true
        schema:
          $ref: '#/definitions/reports.BackfillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created or recovered immutable safe report detail.
          schema:
            $ref: '#/definitions/reports.ReportDetail'
        "400":
          description: Missing, malformed, oversized, or invalid task ID.
        "401":
          description: Unauthenticated.
        "403":
          description: Administrator role, completed password change, or valid CSRF token required.
        "500":
          description: Trusted completed task, report generation, persistence, or durable audit unavailable; internal details are not exposed.
      summary: Backfill a missing immutable report snapshot
      tags:
      - platform-reports
  /api/v1/platform/brand:
    get:
      description: Returns the current mutable brand configuration to an authenticated user, auditor, or administrator. Brand changes affect future report snapshots only and never rewrite historical reports.
      produces:
      - application/json
      responses:
        "200":
          description: Current brand configuration.
          schema:
            $ref: '#/definitions/brand.Config'
        "401":
          description: Unauthenticated.
      summary: Get current report brand
      tags:
      - platform-brand
    put:
      consumes:
      - application/json
      description: An administrator-only brand update requiring Cookie authentication, the password-change gate, and CSRF. The optional Logo must be a decoded PNG or JPEG no larger than 1 MiB, no wider or taller than 4096 pixels, and no more than 16,777,216 pixels; declared MIME must match. The governed change records durable audit state and affects future snapshots only.
      parameters:
      - in: body
        name: brand
        required: true
        schema:
          $ref: '#/definitions/brand.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated current brand configuration.
          schema:
            $ref: '#/definitions/brand.Config'
        "400":
          description: Invalid product name, six-digit color, Logo size, image type, MIME, dimensions, or request size.
        "401":
          description: Unauthenticated.
        "403":
          description: Administrator role, completed password change, or valid CSRF token required.
        "500":
          description: Persistence or durable audit unavailable; internal details are not exposed.
      summary: Update governed report brand
      tags:
      - platform-brand
  /api/v1/platform/reports:
    get:
      description: Returns a paginated safe summary list. Users see only their own reports; auditors and administrators have global read access. page defaults to 1, page_size defaults to 20 and is capped at 100. Stored raw engine results, render JSON, owner IDs, Logo bytes, paths, and mutable brand metadata are never exposed.
      parameters:
      - default: 1
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: 20
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Authorized safe summary page.
          schema:
            $ref: '#/definitions/reports.ReportListResponse'
        "400":
          description: Invalid page or page_size.
        "401":
          description: Unauthenticated.
        "403":
          description: Role cannot list reports.
        "500":
          description: Report query failed; internal details are not exposed.
      summary: List authorized immutable reports
      tags:
      - platform-reports
  /api/v1/platform/reports/trends:
    get:
      description: Returns server-computed, zero-filled UTC calendar-day buckets including the current UTC day. days defaults to 30 and cannot exceed 30. Users receive only their own aggregate; auditors and administrators receive the global aggregate. A snapshot's immutable RenderModel separately freezes exactly 30 day buckets for historical online/PDF consistency.
      parameters:
      - default: 30
        in: query
        maximum: 30
        minimum: 1
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Requested fixed UTC buckets.
          schema:
            items:
              $ref: '#/definitions/reports.TrendPoint'
            type: array
        "400":
          description: days is outside 1 through 30.
        "401":
          description: Unauthenticated.
        "403":
          description: Role cannot read report trends.
        "500":
          description: Trend query failed; internal details are not exposed.
      summary: Get authorized server-side report trend
      tags:
      - platform-reports
  /api/v1/platform/reports/{reportID}:
    get:
      description: Returns the safe immutable RenderModel for one report. Users read only their own reports; auditors and administrators have global read access. raw engine results, stored render JSON, Logo bytes, owner IDs, paths, and mutable brand records are never exposed.
      parameters:
      - in: path
        name: reportID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Authorized immutable report detail.
          schema:
            $ref: '#/definitions/reports.ReportDetail'
        "401":
          description: Unauthenticated.
        "403":
          description: Role cannot read reports.
        "404":
          description: Report not found or not visible to the user.
        "500":
          description: Report query or immutable render decoding failed; internal details are not exposed.
      summary: Get safe immutable report detail
      tags:
      - platform-reports
  /api/v1/platform/reports/{reportID}/exports/pdf:
    post:
      description: Exports a PDF from the same immutable snapshot used by online detail; retries never recompute engine results or use current branding. Users export only their own reports; auditors and administrators have global export access. Requires Cookie authentication, the password-change gate, and CSRF. Every attempt records durable pending and completion audit state; failed append delivery remains recoverable in the outbox.
      parameters:
      - in: path
        name: reportID
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF rendered from the same immutable snapshot.
          schema:
            type: file
        "401":
          description: Unauthenticated.
        "403":
          description: Report ownership/read role, completed password change, or valid CSRF token required.
        "404":
          description: Report not found or not visible to the user.
        "500":
          description: Render or durable audit completion failed; raw findings, paths, and internal errors are not exposed.
      summary: Export an audited immutable report PDF
      tags:
      - platform-reports
  /api/v1/app/models:
    get:
      deprecated: true
      description: Deprecated browser compatibility path. It is protected by the authenticated Subject, delegates platform records to encrypted storage, and appends read-only YAML models with masked tokens and preserved default string arrays. Platform records return an empty default array. Use /api/v1/platform/models for new clients.
      tags:
      - models
      summary: List models through deprecated compatibility facade
      responses:
        "200":
          description: Visible model metadata with masked tokens.
          schema:
            $ref: '#/definitions/websocket.LegacyModelListEnvelope'
        "401":
          description: Unauthenticated.
        "403":
          description: The must-change-password gate or model read scope forbids access.
    post:
      deprecated: true
      description: Deprecated browser compatibility path. Accepts the nested legacy request, stores the token only through authenticated encryption, and returns the legacy HTTP 200 status/message/data envelope. Before any mutation it loads the read-only YAML source once; a matching trimmed ID cannot shadow a YAML model and returns status one, while a source error fails closed with status one and no database or audit mutation. Use POST /api/v1/platform/models for new clients.
      tags:
      - models
      summary: Create a model through deprecated compatibility facade
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/websocket.LegacyModelCreateRequest'
      responses:
        "200":
          description: Legacy mutation envelope; status is zero on success or one for validation/application errors.
          schema:
            $ref: '#/definitions/websocket.LegacyModelMutationEnvelope'
        "401":
          description: Unauthenticated.
        "403":
          description: User or administrator role, the must-change-password gate, and a valid CSRF token are required; auditors cannot create models.
    delete:
      deprecated: true
      description: Deprecated collection-delete compatibility path. Accepts model_ids and returns the legacy HTTP 200 status/message/data envelope. Authorization is checked for every model before deletion.
      tags:
      - models
      summary: Delete models through deprecated compatibility facade
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/websocket.LegacyModelDeleteRequest'
      responses:
        "200":
          description: Legacy mutation envelope; status is zero on success or one for validation/application errors.
          schema:
            $ref: '#/definitions/websocket.LegacyModelMutationEnvelope'
        "401":
          description: Unauthenticated.
        "403":
          description: Owner or administrator access to every requested platform model, the must-change-password gate, and a valid CSRF token are required; YAML models are read-only.
  /api/v1/app/models/{modelId}:
    get:
      deprecated: true
      description: Deprecated browser compatibility path. Returns an authorized encrypted platform model or falls back to a read-only YAML model when the ID is absent from platform storage. The token is always masked and default is always a string array. Use GET /api/v1/platform/models/{modelID} for new clients.
      tags:
      - models
      summary: Get a model through deprecated compatibility facade
      parameters:
      - in: path
        maxLength: 128
        name: modelId
        required: true
        type: string
      responses:
        "200":
          description: Legacy detail envelope; application errors also use HTTP 200 with status one.
          schema:
            $ref: '#/definitions/websocket.LegacyModelDetailEnvelope'
        "401":
          description: Unauthenticated.
        "403":
          description: The must-change-password gate or model read scope forbids access to this private model.
    put:
      deprecated: true
      description: Deprecated browser compatibility path. Accepts the nested legacy update request; an omitted or masked token preserves the encrypted token. Returns the legacy HTTP 200 status/message/data envelope.
      tags:
      - models
      summary: Update a model through deprecated compatibility facade
      parameters:
      - in: path
        maxLength: 128
        name: modelId
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/websocket.LegacyModelUpdateRequest'
      responses:
        "200":
          description: Legacy mutation envelope; status is zero on success or one for validation/application errors.
          schema:
            $ref: '#/definitions/websocket.LegacyModelMutationEnvelope'
        "401":
          description: Unauthenticated.
        "403":
          description: Owner or administrator access to the platform model, the must-change-password gate, and a valid CSRF token are required; YAML models are read-only.
  /api/v1/platform/admin/users:
    get:
      description: Lists local accounts in a paginated safe envelope. Administrator only; credential material is never returned. page defaults to 1, page_size defaults to 20, values over 100 are capped at 100, and page cannot exceed 1000.
      parameters:
      - default: 1
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: 20
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      tags:
      - platform-admin
      summary: List managed users
      responses:
        "200":
          description: User metadata without password hashes.
          schema:
            $ref: '#/definitions/admin.UserListResponse'
        "400":
          description: Invalid page or page_size.
        "401":
          description: Unauthenticated.
        "403":
          description: Administrator role and completed password change required.
        "500":
          description: Account query failed; internal details are not exposed.
    post:
      description: Creates a local account with an administrator-assigned role and records an audit event. Passwords and hashes are never returned.
      tags:
      - platform-admin
      summary: Create managed user
      responses:
        "201":
          description: User created and audited.
        "403":
          description: Administrator role required.
  /api/v1/platform/admin/users/{userID}/role:
    put:
      description: Assigns admin, user, or auditor and records an audit event. Administrator only.
      tags:
      - platform-admin
      summary: Assign user role
      parameters:
      - in: path
        name: userID
        required: true
        type: string
      responses:
        "204":
          description: Role assigned and audited.
        "403":
          description: Administrator role required.
  /api/v1/platform/admin/users/{userID}/active:
    put:
      description: Enables or disables an account, revokes sessions on disable, and records an audit event. Administrator only.
      tags:
      - platform-admin
      summary: Set account active state
      parameters:
      - in: path
        name: userID
        required: true
        type: string
      responses:
        "204":
          description: Account state changed and audited.
        "403":
          description: Administrator role required.
  /api/v1/platform/admin/users/{userID}/password-reset:
    post:
      description: Requests a password reset through the configured out-of-band channel and records an audit event. The HTTP response never contains a reset token.
      tags:
      - platform-admin
      summary: Request managed password reset
      parameters:
      - in: path
        name: userID
        required: true
        type: string
      responses:
        "204":
          description: Reset requested and audited; no token is returned.
        "403":
          description: Administrator role required.
  /api/v1/platform/admin/audit-events:
    get:
      description: Queries append-only recursively sanitized audit events in a paginated envelope. Governed mutations correlate durable pending and completion evidence by request_id. Administrators and auditors may read; ordinary users are denied. page defaults to 1, page_size defaults to 20, values over 100 are capped at 100, and page cannot exceed 1000.
      parameters:
      - in: query
        name: action
        type: string
      - in: query
        name: actor_user_id
        type: string
      - in: query
        name: resource_type
        type: string
      - in: query
        name: resource_id
        type: string
      - default: 1
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: 20
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      tags:
      - audit
      summary: Query audit events
      responses:
        "200":
          description: Sanitized audit event page.
          schema:
            $ref: '#/definitions/admin.AuditListResponse'
        "400":
          description: Invalid page or page_size.
        "401":
          description: Unauthenticated.
        "403":
          description: Administrator or auditor role and completed password change required.
        "500":
          description: Audit query failed; internal details are not exposed.
  /api/v1/platform/admin/audit-events/prepared/{requestID}/finalize:
    post:
      description: Administrator-only recovery for a prepared file-backed mutation after an operator verifies its real outcome. It promotes the existing request to the same stable outbox and event identity without repeating the file mutation. Retrying the same outcome is idempotent; a conflicting outcome returns 409. The request_id is obtained from the audit-event query or the safe X-Audit-Request-ID header returned when a successful legacy mutation needs recovery.
      tags:
      - audit
      summary: Finalize a prepared audit completion
      parameters:
      - in: path
        name: requestID
        required: true
        type: string
      - in: body
        name: body
        required: true
        schema:
          type: object
          required:
          - outcome
          properties:
            outcome:
              type: string
              enum:
              - success
              - failure
            metadata:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: The prepared completion is durably ready for reconciliation.
        "400":
          description: Invalid outcome or request body.
        "403":
          description: Administrator role required.
        "404":
          description: Prepared request not found.
        "409":
          description: The request was already finalized with a different outcome.
  /api/v1/platform/admin/audit-events/reconcile:
    post:
      description: Retries durable audit completion outbox entries whose final append previously failed. Delivery uses a stable event identifier, so repeated reconciliation does not duplicate audit events. Administrator only.
      tags:
      - audit
      summary: Reconcile pending audit completions
      parameters:
      - in: query
        name: limit
        type: integer
      responses:
        "200":
          description: Number of completion events reconciled.
        "403":
          description: Administrator role required.
  /api/v1/platform/models:
    get:
      description: Lists visible model metadata in CatalogPage. Every token is masked as ******** and every row declares source=platform|yaml plus read_only. Users see global and their own private platform models; auditors see global rows read-only; administrators see all platform rows. Immutable YAML rows are appended after platform rows, remain read_only=true, and a same-ID YAML row remains distinct instead of shadowing the platform row. YAML loading is cached and fails closed. page defaults to 1, page_size defaults to 20, values over 100 are capped at 100, and page cannot exceed 1000.
      parameters:
      - default: 1
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: 20
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      tags:
      - models
      summary: List governed models
      responses:
        "200":
          description: Visible safe model catalog with masked tokens.
          schema:
            $ref: '#/definitions/models.CatalogPage'
        "400":
          description: Invalid page or page_size.
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or the Subject role is unsupported.
        "500":
          description: Platform or YAML catalog unavailable; internal source paths and details are not exposed.
    post:
      description: Creates an AES-GCM encrypted model configuration. Users may create only private models they own; administrators may create global models; auditors cannot write.
      parameters:
      - in: body
        name: model
        required: true
        schema:
          $ref: '#/definitions/models.CreateInput'
      tags:
      - models
      summary: Create governed model
      responses:
        "201":
          description: Model metadata with a masked token.
          schema:
            $ref: '#/definitions/models.View'
        "400":
          description: Invalid model input.
        "401":
          description: Unauthenticated.
        "403":
          description: Scope/role is not permitted, password change is incomplete, or CSRF is invalid.
        "500":
          description: Encryption, persistence, or durable audit failed; internal details are not exposed.
  /api/v1/platform/models/{modelID}:
    get:
      description: Returns authorized model metadata with a masked token. Another user's private model is never disclosed.
      tags:
      - models
      summary: Get governed model
      parameters:
      - in: path
        name: modelID
        required: true
        type: string
      responses:
        "200":
          description: Model metadata with masked token.
          schema:
            $ref: '#/definitions/models.View'
        "401":
          description: Unauthenticated.
        "403":
          description: Private model belongs to another user.
        "404":
          description: Model not found.
        "500":
          description: Model query failed; internal details are not exposed.
    put:
      description: Updates an authorized private or global model and audits the change. A masked token value preserves the existing encrypted token.
      parameters:
      - in: path
        name: modelID
        required: true
        type: string
      - in: body
        name: model
        required: true
        schema:
          $ref: '#/definitions/models.UpdateInput'
      tags:
      - models
      summary: Update governed model
      responses:
        "200":
          description: Updated metadata with masked token.
          schema:
            $ref: '#/definitions/models.View'
        "400":
          description: Invalid model input.
        "401":
          description: Unauthenticated.
        "403":
          description: Write is not permitted, password change is incomplete, or CSRF is invalid.
        "404":
          description: Model not found.
        "500":
          description: Encryption, persistence, or durable audit failed; internal details are not exposed.
    delete:
      description: Deletes an authorized model and records an audit event.
      parameters:
      - in: path
        name: modelID
        required: true
        type: string
      tags:
      - models
      summary: Delete governed model
      responses:
        "204":
          description: Model deleted and audited.
        "401":
          description: Unauthenticated.
        "403":
          description: Write is not permitted, password change is incomplete, or CSRF is invalid.
        "404":
          description: Model not found.
        "500":
          description: Persistence or durable audit failed; internal details are not exposed.
  /api/v1/platform/models/{modelID}/rotate-encryption:
    post:
      description: Re-encrypts a stored global model token with the active environment-injected master key. Administrator only; private platform models and immutable YAML models cannot be rotated, and plaintext is never returned or logged.
      parameters:
      - in: path
        name: modelID
        required: true
        type: string
      tags:
      - models
      summary: Rotate model token encryption
      responses:
        "204":
          description: Token re-encrypted and audited.
        "401":
          description: Unauthenticated.
        "403":
          description: Administrator role, writable global model, completed password change, and valid CSRF required.
        "404":
          description: Model not found.
        "500":
          description: Decryption, encryption, persistence, or durable audit failed; internal details are not exposed.
  /api/v1/platform/tasks:
    get:
      description: Lists persisted platform tasks as TaskListResponse without polling the engine or mutating state. Users see only their own tasks; auditors and administrators see the stable global list. Items use the narrow TaskSummary only. page defaults to 1, page_size defaults to 20, values over 100 are capped at 100, and page cannot exceed 1000. Optional status and task_type filters accept only the documented exact canonical values and are applied before total and pagination.
      parameters:
      - default: 1
        in: query
        maximum: 1000
        minimum: 1
        name: page
        type: integer
      - default: 20
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - enum:
        - pending
        - dispatching
        - running
        - succeeded
        - failed
        - dispatch_failed
        - dispatch_unknown
        - cancelled
        in: query
        name: status
        type: string
      - enum:
        - mcp_scan
        - ai_infra_scan
        - model_redteam_report
        - agent_scan
        in: query
        name: task_type
        type: string
      responses:
        "200":
          description: Authorized stable task list.
          schema:
            $ref: '#/definitions/tasks.TaskListResponse'
        "400":
          description: Invalid page, page_size, status, or task_type; filter values must be exact canonical values.
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or the Subject role is unsupported.
        "500":
          description: Task query failed; internal details are not exposed.
      summary: List authorized platform tasks
      tags:
      - platform-tasks
    post:
      consumes:
      - application/json
      description: 'Breaking security hardening: create responses now use the browser-safe TaskDetail with bounded input_summary instead of the former internal task View; clients must migrate field access. The JSON body is limited to 256 KiB. Creates an owner-scoped platform task from the authenticated Cookie Subject. Idempotency-Key is required and unique per owner. A retry with the same persisted request payload returns the existing task without revalidating live governed references; reusing that key with a different payload returns 400 invalid task request. Only exact canonical task types are accepted and the platform maps them to private Agent aliases: mcp_scan params allow model_id and thread; ai_infra_scan params allow model_id, timeout, and port_scan_mode (fixed_ai or full_tcp; omission defaults to fixed_ai); model_redteam_report params require model_id as a bounded string array plus eval_model_id and may include dataset numPrompts/randomSeed/promptColumn and techniques; agent_scan params require agent_id and eval_model_id. Every model_id/eval_model_id must resolve through the governed model boundary, and agent_id through the user or public Agent registry, before persistence; unknown or invisible references write no task. Unknown fields, nested credential objects, raw model credentials, and legacy aliases are rejected. Attachments are supplied only as at most ten opaque attachment IDs. Dispatch uses persisted claims and a global attempt budget. An uncertain network acknowledgement becomes dispatch_unknown and is never submitted automatically again; this is at-most-once dispatch, not exactly-once execution. Requires CSRF protection.'
      parameters:
      - in: header
        maxLength: 128
        name: Idempotency-Key
        required: true
        type: string
      - in: body
        name: task
        required: true
        schema:
          properties:
            attachment_ids:
              items:
                maxLength: 128
                type: string
              maxItems: 10
              type: array
            content:
              maxLength: 32768
              type: string
            country_iso_code:
              enum:
              - ""
              - zh
              - zh_CN
              - en
              type: string
            params:
              description: Exact per-task schema described by this operation; arbitrary and credential-bearing fields are rejected.
              type: object
            task_type:
              enum:
              - mcp_scan
              - ai_infra_scan
              - model_redteam_report
              - agent_scan
              type: string
          required:
          - task_type
          type: object
      responses:
        "202":
          description: Browser-safe persisted task detail; raw request, attachment, identity, and engine fields are absent.
          schema:
            $ref: '#/definitions/tasks.TaskDetail'
        "400":
          description: Fixed generalized body. Missing idempotency key, malformed input, or raw credentials return error=invalid task request; a missing or not ready attachment returns error=attachment unavailable. Identifiers, paths, states, content, and internal errors are never echoed.
          schema:
            $ref: '#/definitions/tasks.TaskCreateBadRequestResponse'
        "401":
          description: Unauthenticated.
        "403":
          description: Role cannot create tasks, password change is incomplete, or CSRF is invalid.
        "500":
          description: Persistence or durable audit failed; internal details are not exposed.
        "503":
          description: Fixed safe error plus persisted browser-safe task detail; dispatch diagnostics are not exposed.
          schema:
            $ref: '#/definitions/tasks.TaskCreateErrorResponse'
      summary: Create an idempotent platform task
      tags:
      - platform-tasks
  /api/v1/platform/tasks/{taskID}:
    get:
      description: Short-poll browser-safe TaskDetail using the authenticated Cookie Subject. Users read only their own task; auditors and administrators have global read access. The input_summary is a narrow display projection; browser-supplied identity headers are ignored.
      parameters:
      - in: path
        name: taskID
        required: true
        type: string
      responses:
        "200":
          description: Current platform task status.
          schema:
            $ref: '#/definitions/tasks.TaskDetail'
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or the Subject role is unsupported.
        "404":
          description: Task not found or not visible to this user.
        "500":
          description: Task query failed; internal details are not exposed.
      summary: Get owned task status
      tags:
      - platform-tasks
  /api/v1/platform/tasks/{taskID}/result:
    get:
      deprecated: true
      description: Retired browser result route. After Cookie authentication and the password-change gate it always returns 410 Gone, regardless of task identity or state. It never reads or returns engine results. Authentication failure remains 401 and an incomplete password change remains 403.
      parameters:
      - in: path
        name: taskID
        required: true
        type: string
      responses:
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete.
        "410":
          description: Browser task result retrieval is permanently retired; use immutable reports.
      summary: Retired browser task result route
      tags:
      - platform-tasks
  /api/v1/platform/tasks/{taskID}/cancel:
    post:
      description: Cancels an owned task or, for administrators, any task. A task owned by another user is indistinguishable from an absent task and returns 404; auditors remain read-only with 403. Only the exact 204 response represents confirmed cancellation; clients may perform one status GET after an uncertain transport/server/non-contract-2xx outcome but must never automatically repeat the POST. Requires CSRF protection and records a durable audit event.
      parameters:
      - in: path
        name: taskID
        required: true
        type: string
      responses:
        "204":
          description: Task cancelled and audited.
        "401":
          description: Unauthenticated.
        "403":
          description: Auditors or unsupported roles cannot cancel tasks; password change or CSRF may also be incomplete.
        "404":
          description: Task not found or owned by another ordinary user.
        "500":
          description: Cancellation or durable audit failed; internal details are not exposed.
      summary: Cancel governed task
      tags:
      - platform-tasks
  /api/v1/platform/tasks/attachments:
    post:
      consumes:
      - multipart/form-data
      description: Streams one private attachment owned by the authenticated user or administrator within the configured size limit. Before creation, one bounded batch (at most 100) of expired unbound uploading or ready records plus prior deleting tombstones is cleaned; records finalize only after private storage removal. Auditors cannot create attachments. Requires CSRF. The response exposes only an opaque attachment ID and safe metadata, never a storage name or path.
      parameters:
      - in: formData
        name: file
        required: true
        type: file
      responses:
        "201":
          description: Opaque private attachment metadata.
          schema:
            $ref: '#/definitions/tasks.AttachmentView'
        "400":
          description: Invalid or oversized attachment.
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or CSRF is invalid.
        "413":
          description: Attachment exceeds the configured file-size limit.
        "500":
          description: Storage, persistence, or durable audit failed; internal details are not exposed.
      summary: Upload private task attachment
      tags:
      - platform-task-attachments
  /api/v1/platform/tasks/attachments/chunked:
    post:
      consumes:
      - application/json
      description: Begins an owner-scoped chunked upload for an authenticated user or administrator after validating the declared total size. Before creation, one bounded batch (at most 100) of expired unbound uploading or ready records plus prior deleting tombstones is cleaned. Records are finalized only after private storage removal succeeds, so failures remain retryable. The configured TTL is 24 hours by default. Auditors cannot create attachments. Requires CSRF.
      parameters:
      - in: body
        name: attachment
        required: true
        schema:
          properties:
            filename:
              type: string
            size:
              format: int64
              type: integer
          required:
          - filename
          - size
          type: object
      responses:
        "201":
          description: Opaque uploading attachment metadata.
          schema:
            $ref: '#/definitions/tasks.AttachmentView'
        "400":
          description: Invalid filename or size.
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or CSRF is invalid.
        "413":
          description: Declared size exceeds the configured file-size limit.
        "500":
          description: Persistence or durable audit failed; internal details are not exposed.
      summary: Begin private chunked upload
      tags:
      - platform-task-attachments
  /api/v1/platform/tasks/attachments/{attachmentID}/chunks:
    post:
      consumes:
      - multipart/form-data
      description: Streams one non-empty bounded chunk. chunk_index must be non-negative and less than the configured ceil(max upload bytes / max chunk bytes); the default maximum is ten chunks. Owner users may write their own attachment; administrators may write any attachment; auditors are read-only. Cumulative size is enforced atomically. Requires CSRF.
      parameters:
      - in: path
        name: attachmentID
        required: true
        type: string
      - in: formData
        name: chunk_index
        required: true
        type: integer
      - in: formData
        name: chunk
        required: true
        type: file
      responses:
        "204":
          description: Chunk accepted.
        "400":
          description: Invalid chunk index or attachment state.
        "401":
          description: Unauthenticated.
        "403":
          description: Subject cannot write this attachment, password change is incomplete, or CSRF is invalid.
        "404":
          description: Attachment not found.
        "413":
          description: Chunk exceeds the configured chunk-size limit.
        "500":
          description: Storage, persistence, or durable audit failed; internal details are not exposed.
      summary: Upload private attachment chunk
      tags:
      - platform-task-attachments
  /api/v1/platform/tasks/attachments/{attachmentID}/merge:
    post:
      consumes:
      - application/json
      description: Merges a positive configured-bounded chunk count by streaming while enforcing declared, cumulative, and actual size equality. Owner users may merge their own attachment; administrators may merge any attachment; auditors are read-only. Requires CSRF.
      parameters:
      - in: path
        name: attachmentID
        required: true
        type: string
      - in: body
        name: merge
        required: true
        schema:
          properties:
            file_size:
              format: int64
              type: integer
            total_chunks:
              type: integer
          required:
          - total_chunks
          - file_size
          type: object
      responses:
        "200":
          description: Ready opaque attachment metadata.
          schema:
            $ref: '#/definitions/tasks.AttachmentView'
        "400":
          description: Chunk count or sizes do not match.
        "401":
          description: Unauthenticated.
        "403":
          description: Subject cannot write this attachment, password change is incomplete, or CSRF is invalid.
        "404":
          description: Attachment not found.
        "500":
          description: Storage, persistence, or durable audit failed; internal details are not exposed.
      summary: Merge private attachment chunks
      tags:
      - platform-task-attachments
  /api/v1/platform/tasks/attachments/{attachmentID}:
    delete:
      description: Aborts and deletes an owner-scoped uploading or ready attachment only while it remains unbound. Owner users may delete their own unbound attachment; administrators may govern any unbound attachment; other users receive 404 and auditors receive 403. Task-bound attachments are never deleted. The server first persists a deleting tombstone and finalizes the record only after private storage cleanup succeeds; failures remain retryable and TTL cleanup is the fallback. Requires CSRF.
      parameters:
      - in: path
        name: attachmentID
        required: true
        type: string
      responses:
        "204":
          description: Uploading attachment deleted.
        "400":
          description: Attachment is task-bound or otherwise not abortable.
        "401":
          description: Unauthenticated.
        "403":
          description: Auditor or unsupported role cannot delete attachments; password change or CSRF may also be incomplete.
        "404":
          description: Attachment is absent or belongs to another ordinary user.
        "500":
          description: Storage or persistence cleanup failed; internal details are not exposed.
      summary: Abort private attachment upload
      tags:
      - platform-task-attachments
  /api/v1/platform/tasks/attachments/{attachmentID}/download:
    get:
      description: Downloads a ready or task-bound private attachment after authorization. An owner user may read their own attachment; other users receive 404 to avoid existence disclosure; auditors receive 403; administrators may read any attachment. Before an administrator cross-owner storage open, the server durably records a successful attachment.download_authorized event with sanitized authorization metadata; this records authorization, not stream delivery. Storage names and paths are never exposed.
      parameters:
      - in: path
        name: attachmentID
        required: true
        type: string
      responses:
        "200":
          description: Streamed attachment.
          schema:
            type: file
        "400":
          description: Attachment is not ready.
        "401":
          description: Unauthenticated.
        "403":
          description: Auditor or unsupported role cannot download attachments; password change may also be incomplete.
        "404":
          description: Attachment is absent, storage is absent, or it belongs to another ordinary user.
        "500":
          description: Storage open or required authorization audit failed; no bytes or internal details are returned.
      summary: Download authorized private attachment
      tags:
      - platform-task-attachments
  /api/v1/knowledge/fingerprints:
    get:
      description: Reads existing fingerprint summaries for authenticated admin, user, or auditor roles. Exactly one decimal page=1..1000 and size=1..100 is accepted; empty, duplicate, non-decimal, overflowing, or out-of-range values return 400.
      parameters:
      - in: query
        name: page
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
      - in: query
        name: size
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      tags:
      - knowledge
      summary: List fingerprints
      responses:
        "200":
          description: Existing fingerprint data in the legacy-compatible format.
    post:
      description: Creates fingerprint content through the admin-only governed facade. The original on-disk format is preserved and the change is audited.
      tags:
      - knowledge
      summary: Create fingerprint
      responses:
        "200":
          description: Future scans use the new content; historical report snapshots are unchanged.
          headers:
            X-Audit-Request-ID:
              type: string
              description: Present only when the file mutation succeeded but its prepared audit completion needs explicit administrator finalization; no internal error or metadata is exposed.
        "403":
          description: Administrator role required.
  /api/v1/knowledge/fingerprints/{name}/raw:
    get:
      description: Returns exact UTF-8 YAML bytes by one unique recursive info.name match inside the fixed fingerprint root. Ambiguous matches, symlinks, paths outside the root, and files over 1 MiB fail closed.
      parameters:
      - in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: Legacy envelope whose data contains only content.
        "400":
          description: Invalid opaque name or unsafe file resolution.
        "401":
          description: Unauthenticated.
        "403":
          description: Password change is incomplete or role is unsupported.
        "404":
          description: Rule content is absent.
        "413":
          description: Rule content exceeds 1 MiB.
        "500":
          description: Sanitized file-read failure; no path is returned.
      summary: Read exact fingerprint source
      tags:
      - knowledge
  /api/v1/knowledge/vulnerabilities:
    get:
      description: Lists vulnerability summaries. Exactly one decimal page=1..1000 and size=1..100 is accepted; invalid or repeated values return 400.
