  /api/v1/knowledge/evaluations/{name}/raw:
    get:
      description: Returns the exact UTF-8 JSON bytes through the legacy envelope without reserialization. The requested regular file must stay below 1 MiB and inside the fixed evaluation root; symlinks are rejected.
